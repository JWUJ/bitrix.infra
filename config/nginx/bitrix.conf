ssl_certificate      /etc/nginx/letsencrypt/live/hiik.ru/fullchain.pem;
ssl_certificate_key  /etc/nginx/letsencrypt/live/hiik.ru/privkey.pem;
ssl_trusted_certificate /etc/nginx/letsencrypt/live/hiik.ru/chain.pem;

include security_headers.conf;
# CSP headers, too dangerous to include to the code someone will copy and run
# Glob: matching nothing is fine on a fresh clone; overlay drops its snippet here
include /etc/nginx/private.conf.d/bitrix_csp_headers*.conf;

charset utf-8;
index index.php;

# remove multiple slashes
# duplicated slashes will work and won't be rewritten, fixing it in this configuration is tricky
rewrite ^([^.]*?\/)\/+(.*)$ $1$2 permanent;

location / {
    # Composite site: if a Bitrix composite snapshot exists for this anonymous,
    # param-less GET/HEAD, nginx serves it directly (~0.03s, no PHP); otherwise the
    # request falls through to @bitrix -> PHP. $bx_composite_file is computed in
    # conf.d/composite.conf and defaults to $uri (a no-op) so this stays inert
    # until Bitrix composite is enabled and starts writing snapshots. See the
    # "Composite site" section in Readme.md to enable.
    try_files $bx_composite_file $uri $uri/ @bitrix;
}

location @bitrix {
    try_files $uri $uri/ /bitrix/urlrewrite.php$is_args$args;
}

location = /restore.php {
    fastcgi_pass php-upstream;
    include fastcgi.conf;

    client_body_buffer_size 8192m;
    client_max_body_size 8192m;
}

location = /favicon.png {
    log_not_found off;
    access_log off;
}

# Root icon URLs carry no ?v=, so the site-wide `immutable` static rule below would pin a
# replaced icon in the browser for ten years (the mark changed on 15.09.2026 and everyone
# who had opened the site before that kept the old one). A day is enough here; the
# versioned copies under /local/templates/light/brand/ keep the long cache. Exact matches,
# so the generic static regex location never sees these three paths.
location = /favicon.ico {
    error_page 404 /404.html;
    log_not_found off;
    add_header Cache-Control "public, max-age=86400";
    include security_headers.conf;
    include /etc/nginx/private.conf.d/static_csp_headers*.conf;
}

location = /favicon.svg {
    error_page 404 /404.html;
    log_not_found off;
    add_header Cache-Control "public, max-age=86400";
    include security_headers.conf;
    include /etc/nginx/private.conf.d/static_csp_headers*.conf;
}

location = /apple-touch-icon.png {
    error_page 404 /404.html;
    log_not_found off;
    add_header Cache-Control "public, max-age=86400";
    include security_headers.conf;
    include /etc/nginx/private.conf.d/static_csp_headers*.conf;
}

location ^~ /robots.txt {
    log_not_found off;
    access_log off;
    # aspro.max multi-region robots.txt rewrite
    rewrite "robots.txt" /aspro_regions/robots/robots_$host.txt break;
}

location = /404.html {
    internal;
    access_log off;
    return 404;
}

# Any path component starting with a dot is denied by default (.git/, .claude/,
# .beads/, .env, .DS_Store, vim swap, .settings.php, …) — never web-served.
location ~ (?:^|/)\.(?!well-known/|default/) {
    deny all;
}

# Published loaders for unregistered core modules have no site use.
location = /bitrix/tools/calendar/push.php { return 404; }
location = /bitrix/tools/stssync.php { return 404; }
location = /bitrix/tools/sonet_set_content_view.php { return 404; }
location = /bitrix/tools/sonet_group_set_owner.php { return 404; }
location = /bitrix/tools/bizproc/user_selector.php { return 404; }

# Bitrix advisory CVE-2023-1720: uploaded HTML must not execute in the site origin.
location ~* ^/upload/.*\.html?$ {
    types { }
    default_type text/plain;
    try_files $uri =404;
    include security_headers.conf;
}

# Uploads are user-writable. Never execute or serve server-side source from them.
location ~* ^/upload/.*\.(?:php[0-9]*|phtml|pht|phar|inc)(?:/|$) {
    access_log off;
    log_not_found off;
    return 404;
}

# Uploaded SVG can carry scripts: serve it sandboxed so nothing runs in the
# site origin when it is opened as a document (as <img> the header is inert)
location ~* ^/upload/.+\.svg$ {
    error_page 404 /404.html;
    log_not_found off;
    add_header Cache-Control "public, max-age=315360000, immutable";
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; sandbox" always;
    include security_headers.conf;
}

# aspro.max multi-region sitemap rewrite
location ~ ^/sitemap.*\.xml$ {
    rewrite "/(sitemap.*)\.xml" /aspro_regions/sitemap/$1_$host.xml break;
}

# calculator source maps reveal the original engine sources — internal only
location ~* ^/local/components/calc/.+\.map$ { deny all; }

# all static locations except for txt and xml, with invalid referer check
location ~* ^.+\.(jpeg|jpg|png|gif|bmp|ico|svg|tif|tiff|css|map|js|json|htm|ttf|otf|webp|woff2?|csv|rtf|doc|docx|xls|xlsx|ppt|pptx|odf|odp|ods|odt|pdf|psd|ai|eot|eps|ps|zip|tar|tgz|gz|rar|bz2?|7z|aac|m4a|mp3|mp4|ogg|wav|wma|3gp|avi|flv|m4v|mkv|mov|mpe?g|wmv|exe|iso|dmg|swf|webmanifest)$ {
    error_page 404 /404.html;
    log_not_found off;
    access_log /var/log/nginx/static-download.access.log main if=$audit_static_download;
    add_header Cache-Control "public, max-age=315360000, immutable";
    include security_headers.conf;
    include /etc/nginx/private.conf.d/static_csp_headers*.conf;

    if ($hotlink_block) {
        return 403;
    }
}

# xml and txt static location, without referer check
location ~* ^.+\.(xml|txt)$ {
    error_page 404 /404.html;
    log_not_found off;
    access_log /var/log/nginx/static-download.access.log main if=$audit_static_download;
    add_header Cache-Control "public, max-age=3600, must-revalidate";
    include security_headers.conf;
    include /etc/nginx/private.conf.d/static_csp_headers*.conf;
}

# Disable access for non-static assets in cache location
location ~* ^/bitrix/cache { deny all; }

location ~ /upload/ {
    client_body_buffer_size 1024m;
    client_max_body_size 1024m;
}

location ~ /bitrix/admin/fileman_medialib.php {
    fastcgi_pass php-upstream;
    include fastcgi.conf;
    client_body_buffer_size 1024m;
    client_max_body_size 1024m;
}

location ~ \.php$ {
    try_files $uri $uri/ /bitrix/urlrewrite.php$is_args$args;
    include /etc/nginx/conf.d/metrika-cookies.conf;

    fastcgi_pass php-upstream;
    include fastcgi.conf;
}
